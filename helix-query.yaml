version: 1
indices:
  default:
    include:
      - /**
    target: /query-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: attribute(el, "content")
      image:
        select: head > meta[property="og:image"]
        value: attribute(el, "content")
      description:
        select: head > meta[name="description"]
        value: attribute(el, "content")
      date:
        select: head > meta[name="date"]
        value: attribute(el, "content")
      author:
        select: head > meta[name="author"]
        value: attribute(el, "content")
      category:
        select: head > meta[name="category"]
        value: attribute(el, "content")
      template:
        select: head > meta[name="template"]
        value: attribute(el, "content")
      lastModified:
        select: none
        value: dateValue(headers["last-modified"], "ddd, DD MMM YYYY hh:mm:ss GMT")

  # FAQ pages only, read by the faq-hero search (ffetch). Category pages are indexed
  # too; the search keeps template = faq-question.
  faqs:
    include:
      - /faqs/**
      - /en/faqs/**
      - /es/faqs/**
    target: /faqs-index.json
    properties:
      # the question itself (og:title carries the " - everything energy" suffix)
      title:
        selectFirst: main h1
        value: textContent(el)
      description:
        select: head > meta[name="description"]
        value: attribute(el, "content")
      template:
        select: head > meta[name="template"]
        value: attribute(el, "content")
      # answer copy for full-text matching
      content:
        selectFirst: main > div
        value: words(el, 0, 300)
      lastModified:
        select: none
        value: dateValue(headers["last-modified"], "ddd, DD MMM YYYY hh:mm:ss GMT")
